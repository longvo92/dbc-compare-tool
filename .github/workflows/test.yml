name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # The test suite exercises the comparison engine only, so the Qt UI
        # dependency (PySide6) is deliberately not installed here.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cantools>=40.3.0" "openpyxl>=3.1.0"
          python -m pip install -e . --no-deps
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compare the bundled example baselines (CLI smoke test)
        run: |
          python -m dbc_compare_tool.cli --old examples/old --new examples/new --out report.xlsx
          python -m dbc_compare_tool.cli --old examples/old --new examples/new --include-unchanged --out impact_review.xlsx
